name: Build 35 Android Acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  EXPECTED_SOURCE_SHA256: 699b17ac3721dfe91da048bab0568b06408ff63178f9f0d8237d971e03b38756
  SOURCE_ZIP_URL: https://litter.catbox.moe/o954bz.zip

jobs:
  verify-build35:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Validate and reconstruct exact source payload
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p src evidence
          chunks=(payload/b64chunk_*)
          if (( ${#chunks[@]} > 0 )); then
            echo Reconstructing source zip from payload chunks
            cat "${chunks[@]}" | base64 -d > /tmp/src.zip
          else
            echo Downloading SHA-pinned source zip
            curl -fL --retry 3 --retry-delay 2 -o /tmp/src.zip "$SOURCE_ZIP_URL"
          fi
          ACTUAL_SOURCE_SHA256="$(sha256sum /tmp/src.zip | awk '{print $1}')"
          echo "$ACTUAL_SOURCE_SHA256  /tmp/src.zip" | tee evidence/source-zip.sha256
          if [ "$ACTUAL_SOURCE_SHA256" != "$EXPECTED_SOURCE_SHA256" ]; then
            echo ERROR source SHA-256 mismatch
            echo Expected $EXPECTED_SOURCE_SHA256
            echo Actual $ACTUAL_SOURCE_SHA256
            exit 3
          fi
          unzip -t /tmp/src.zip | tee evidence/source-zip-test.txt
          unzip -q /tmp/src.zip -d src
          test -f src/gradlew
          test -d src/app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            src/**/*.gradle*
            src/**/gradle-wrapper.properties

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK 36 tooling
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare Gradle
        working-directory: src
        run: |
          set -euo pipefail
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo org.gradle.daemon=false >> gradle.properties
          echo org.gradle.parallel=false >> gradle.properties
          echo org.gradle.workers.max=2 >> gradle.properties
          echo org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseSerialGC -Dfile.encoding=UTF-8 >> gradle.properties
          echo kotlin.compiler.execution.strategy=in-process >> gradle.properties
          echo kotlin.incremental=false >> gradle.properties
          ./gradlew --no-daemon --version | tee ../evidence/gradle-version.txt

      - name: Unit tests
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest | tee ../evidence/testDebugUnitTest.log

      - name: Compile debug Kotlin
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileDebugKotlin | tee ../evidence/compileDebugKotlin.log

      - name: Android lint
        id: lint
        continue-on-error: true
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --no-daemon lintDebug | tee ../evidence/lintDebug.log

      - name: Assemble debug APK
        working-directory: src
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug | tee ../evidence/assembleDebug.log
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify Build 35 APK identity and integrity
        run: |
          set -euo pipefail
          APK=src/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$ANDROID_HOME/build-tools/35.0.0/aapt
          ZIPALIGN=$ANDROID_HOME/build-tools/35.0.0/zipalign
          APKSIGNER=$ANDROID_HOME/build-tools/35.0.0/apksigner
          "$AAPT" dump badging "$APK" | tee evidence/aapt-badging.txt
          grep -F "package: name='com.nexarenew.drstonecommand' versionCode='35' versionName='0.3.1'" evidence/aapt-badging.txt
          grep -F "sdkVersion:'26'" evidence/aapt-badging.txt
          grep -F "targetSdkVersion:'36'" evidence/aapt-badging.txt
          grep -F "application-label:'INTERCEPT'" evidence/aapt-badging.txt
          "$ZIPALIGN" -c -v 4 "$APK" | tee evidence/zipalign.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee evidence/apksigner.txt
          sha256sum "$APK" | tee evidence/app-debug.apk.sha256
          cp "$APK" evidence/app-debug.apk

      - name: Collect Android reports
        if: always()
        run: |
          set +e
          mkdir -p evidence/reports
          cp -R src/app/build/reports/tests evidence/reports/unit-tests 2>/dev/null || true
          cp src/app/build/reports/lint-results-debug.html evidence/reports/ 2>/dev/null || true
          echo lint_step_outcome=${{ steps.lint.outcome }} | tee evidence/lint-gate.txt

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTERCEPT_V0_3_1_BUILD35_ANDROID_ACCEPTANCE_EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified debug APK
        uses: actions/upload-artifact@v4
        with:
          name: INTERCEPT_V0_3_1_BUILD35_DEBUG_APK
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Record lint gate without blocking APK production
        if: always()
        run: |
          echo "Lint step outcome: ${{ steps.lint.outcome }}"
          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "LINT GATE FAIL recorded. APK was still assembled and identity-verified from unmodified source."
            echo "Job stays green because APK production gates passed; lint remains a recorded residual."
          fi
