name: Build 35 Gradle 8.14.3 Exact-Source Acceptance

on:
  push:
    branches:
      - gradle8143-acceptance-15092026

permissions:
  contents: read

env:
  AUTHORITATIVE_SOURCE_SHA256: 4637da3c223a802b80a4d7866d1b822ca4ad769b4e7dfc7dae2daa22c1df1349
  AUTHORITATIVE_SOURCE_URL: https://sdmntpritalynorth.oaiusercontent.com/files/00000000-666c-8246-ba74-5735ad8a8b24/raw?se=2026-09-15T12%3A57%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=2cf987b3-b64a-5a41-8ef6-1bdab8ec47be&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T05%3A35%3A23Z&ske=2026-09-16T05%3A35%3A23Z&sks=b&skv=2026-02-06&sig=kw4ZzRoMWZwV9cO0H1dg8G%2B5CiA1rYQaB0dgwluJBV0%3D
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process
    -Dkotlin.incremental=false
    -Dfile.encoding=UTF-8
    -Xmx3g
    -XX:MaxMetaspaceSize=768m
    -XX:+UseSerialGC

jobs:
  exact-source-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out isolated acceptance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct exact current source and enforce byte manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src evidence
          curl --fail --location --retry 3 --retry-delay 2 -o /tmp/authoritative.zip "$AUTHORITATIVE_SOURCE_URL"
          echo "$AUTHORITATIVE_SOURCE_SHA256  /tmp/authoritative.zip" | sha256sum -c -
          sha256sum /tmp/authoritative.zip | tee evidence/authoritative-source.sha256
          unzip -t /tmp/authoritative.zip | tee evidence/authoritative-zip-test.txt
          unzip -q /tmp/authoritative.zip -d src

          cat > src/gradle/wrapper/gradle-wrapper.properties <<'WRAPPER'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WRAPPER

          cp payload/CURRENT_BUILD_INPUTS_15092026.sha256 /tmp/expected.sha256
          : > evidence/build-input-verification.txt
          failures=0
          count=0
          while read -r expected path; do
            count=$((count+1))
            if [[ ! -f "src/$path" ]]; then
              echo "MISSING $path" | tee -a evidence/build-input-verification.txt
              failures=1
              continue
            fi
            actual="$(sha256sum "src/$path" | awk '{print $1}')"
            if [[ "$actual" != "$expected" ]]; then
              echo "MISMATCH $path expected=$expected actual=$actual" | tee -a evidence/build-input-verification.txt
              failures=1
            fi
          done < /tmp/expected.sha256
          awk '{print $2}' /tmp/expected.sha256 | sort > /tmp/expected.paths
          (cd src && { find app gradle -type f -print; printf '%s\n' gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties; } | sort -u) > /tmp/actual.paths
          if ! diff -u /tmp/expected.paths /tmp/actual.paths | tee evidence/build-input-path-diff.txt; then failures=1; fi
          echo "manifest_entries=$count" | tee -a evidence/build-input-verification.txt
          if [[ "$count" -ne 115 || "$failures" -ne 0 ]]; then
            echo "EXACT-SOURCE PREFLIGHT FAILED" | tee -a evidence/build-input-verification.txt
            exit 12
          fi
          echo "115/115 CURRENT BUILD INPUTS VERIFIED" | tee -a evidence/build-input-verification.txt
          grep -F 'gradle-8.14.3-bin.zip' src/gradle/wrapper/gradle-wrapper.properties
          grep -F 'distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531' src/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 36 and Build Tools 36.0.0 using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > src/local.properties
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" version | tee evidence/aapt2-version.txt

      - name: Verify Gradle 8.14.3 runtime
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --version | tee ../evidence/gradle-version.txt
          grep -F 'Gradle 8.14.3' ../evidence/gradle-version.txt
          java -version 2>&1 | tee ../evidence/java-version.txt

      - name: Unit tests
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest | tee ../evidence/testDebugUnitTest.log

      - name: Compile debug Kotlin
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileDebugKotlin | tee ../evidence/compileDebugKotlin.log

      - name: Android lint
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon lintDebug | tee ../evidence/lintDebug.log

      - name: Compile instrumentation APK
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleDebugAndroidTest | tee ../evidence/assembleDebugAndroidTest.log

      - name: Clean assemble debug APK
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug | tee ../evidence/clean-assembleDebug.log
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity, alignment, signature and digest
        shell: bash
        run: |
          set -euo pipefail
          APK=src/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$APK" | tee evidence/aapt-badging.txt
          grep -F "package: name='com.nexarenew.drstonecommand' versionCode='35' versionName='0.3.1'" evidence/aapt-badging.txt
          grep -F "sdkVersion:'26'" evidence/aapt-badging.txt
          grep -F "targetSdkVersion:'36'" evidence/aapt-badging.txt
          grep -F "application-label:'INTERCEPT'" evidence/aapt-badging.txt
          "$BT/zipalign" -c -v 4 "$APK" | tee evidence/zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee evidence/apksigner.txt
          sha256sum "$APK" | tee evidence/app-debug.apk.sha256
          cp "$APK" evidence/INTERCEPT_V0_3_1_BUILD35_GRADLE_8_14_3_DEBUG.apk

      - name: Re-verify source build inputs after build
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -d src/app ]]; then
            failures=0
            while read -r expected path; do
              [[ -f "src/$path" ]] || { echo "POSTBUILD MISSING $path"; failures=1; continue; }
              actual="$(sha256sum "src/$path" | awk '{print $1}')"
              [[ "$actual" == "$expected" ]] || { echo "POSTBUILD MISMATCH $path"; failures=1; }
            done < payload/CURRENT_BUILD_INPUTS_15092026.sha256
            echo "postbuild_source_failures=$failures" | tee evidence/postbuild-source-verification.txt
          fi

      - name: Collect reports
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p evidence/reports
          cp -R src/app/build/reports/tests evidence/reports/unit-tests 2>/dev/null || true
          cp src/app/build/reports/lint-results-debug.html evidence/reports/ 2>/dev/null || true
          cp src/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk evidence/ 2>/dev/null || true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INTERCEPT_BUILD35_GRADLE8143_ACCEPTANCE_EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INTERCEPT_BUILD35_GRADLE8143_VERIFIED_APK
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
