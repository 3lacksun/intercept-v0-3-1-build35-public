name: Build 35 Gradle 8.14.3 Visual UI UX Acceptance

on:
  push:
    branches:
      - gradle8143-acceptance-15092026

permissions:
  contents: read

env:
  AUTHORITATIVE_SOURCE_SHA256: 4637da3c223a802b80a4d7866d1b822ca4ad769b4e7dfc7dae2daa22c1df1349
  AUTHORITATIVE_SOURCE_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-2964-81f4-a1da-05ba5f492e96/raw?se=2026-09-15T17%3A41%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=385c386e-737a-5492-8c74-a1e96e67360d&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T06%3A28%3A16Z&ske=2026-09-16T06%3A28%3A16Z&sks=b&skv=2026-02-06&sig=AU94/%2Bd9JFl%2BzJmiXj8su1LMz4dNUeyciwzi0JR2Fig%3D"
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process
    -Dkotlin.incremental=false
    -Dfile.encoding=UTF-8
    -Xmx3g
    -XX:MaxMetaspaceSize=768m
    -XX:+UseSerialGC

jobs:
  visual-uiux-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out isolated acceptance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct and verify authoritative Build 35 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src evidence
          curl --fail --location --retry 3 --retry-delay 2 -o /tmp/authoritative.zip "$AUTHORITATIVE_SOURCE_URL"
          echo "$AUTHORITATIVE_SOURCE_SHA256  /tmp/authoritative.zip" | sha256sum -c -
          sha256sum /tmp/authoritative.zip | tee evidence/authoritative-source.sha256
          unzip -t /tmp/authoritative.zip | tee evidence/authoritative-zip-test.txt
          unzip -q /tmp/authoritative.zip -d src
          cat > src/gradle/wrapper/gradle-wrapper.properties <<'WRAPPER'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WRAPPER
          cp payload/CURRENT_BUILD_INPUTS_15092026.sha256 /tmp/base.sha256
          failures=0; count=0
          while read -r expected path; do
            count=$((count+1))
            [[ -f "src/$path" ]] || { echo "MISSING $path"; failures=1; continue; }
            actual="$(sha256sum "src/$path" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "MISMATCH $path expected=$expected actual=$actual"; failures=1; }
          done < /tmp/base.sha256
          [[ "$count" -eq 115 && "$failures" -eq 0 ]]
          echo "115/115 BASE BUILD INPUTS VERIFIED" | tee evidence/base-build-input-verification.txt

      - name: Apply and verify visual UI UX upgrade overlay
        shell: bash
        run: |
          set -euo pipefail
          cat payload/visual_uiux_overlay_00.b64 payload/visual_uiux_overlay_01.b64 payload/visual_uiux_overlay_02.b64 payload/visual_uiux_overlay_03.b64 > /tmp/visual-overlay.b64
          base64 -d /tmp/visual-overlay.b64 > /tmp/visual-overlay.tar.xz
          echo 'ec8ad6733969800408bf6667c0484364244a6222dc7c904eafe6f84e1cc5f576  /tmp/visual-overlay.tar.xz' | sha256sum -c -
          tar -xJf /tmp/visual-overlay.tar.xz -C src
          cat > /tmp/visual-final.sha256 <<'HASHES'
          81846ef1f078ad1a1a06f40d8136259f9a21c269a5fb8d766cefba980f13997b  app/src/androidTest/java/com/nexarenew/aiconsole/ui/ChatInteractionInstrumentedTest.kt
          d14fcbda814e3e6a3d3ca73a4e7722d722f4a1911385f6b09547b8735d17a3f4  app/src/main/java/com/nexarenew/aiconsole/MainActivity.kt
          063c3b9b19486e75c43953cd6a8a4c097bcb19c02c5f68480db3d6fdb926e3af  app/src/main/java/com/nexarenew/aiconsole/ui/components/StoneUi.kt
          2f2daac51d744903ddf5e311eb5421f40aa9b8baf4b1174c17c8e23005c16d38  app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt
          6e400cfb77a63bfaac4f85a537e5ab2f8cc930af8399bad0fe4d79df735a032b  app/src/main/java/com/nexarenew/aiconsole/ui/screens/DocumentsScreen.kt
          990a32361f0931cc44be328498365d4e7db8f2823c6583d5e21f89c6b2b04b3b  app/src/main/java/com/nexarenew/aiconsole/ui/screens/SettingsScreen.kt
          e0d561e6d9423a9a682046e37e4c0277311629d07c8cb2a9e94474f8f9ecf1f0  app/src/main/java/com/nexarenew/aiconsole/ui/screens/TaskScreen.kt
          256a80fce1f0ceb009bbb4c0b1601c5fa1f0e86a222beb4771db3c1260fcb303  app/src/main/java/com/nexarenew/aiconsole/ui/screens/WorkspaceScreen.kt
          44d6dc351544f8da3e74e85fce222fdaa16fc459cf3c8b1f09c8f738a9f2ec58  app/src/main/java/com/nexarenew/aiconsole/ui/theme/InterceptTheme.kt
          e7b4d7f2edf511cac799802e08d0ac9ea3fd8f309fad984bdec6b40c2a796e94  gradle/wrapper/gradle-wrapper.properties
          HASHES
          (cd src && sha256sum -c /tmp/visual-final.sha256) | tee evidence/visual-uiux-overlay-verification.txt

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > src/local.properties
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" version | tee evidence/aapt2-version.txt

      - name: Verify Gradle 8.14.3 runtime
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --version | tee ../evidence/gradle-version.txt
          grep -F 'Gradle 8.14.3' ../evidence/gradle-version.txt
          java -version 2>&1 | tee ../evidence/java-version.txt

      - name: Unit tests
        working-directory: src
        run: ./gradlew --no-daemon testDebugUnitTest | tee ../evidence/testDebugUnitTest.log

      - name: Compile debug Kotlin
        working-directory: src
        run: ./gradlew --no-daemon :app:compileDebugKotlin | tee ../evidence/compileDebugKotlin.log

      - name: Android lint
        working-directory: src
        run: ./gradlew --no-daemon lintDebug | tee ../evidence/lintDebug.log

      - name: Compile instrumentation APK
        working-directory: src
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest | tee ../evidence/assembleDebugAndroidTest.log

      - name: Clean assemble debug APK
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug | tee ../evidence/clean-assembleDebug.log
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity alignment signature and digest
        shell: bash
        run: |
          set -euo pipefail
          APK=src/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$APK" | tee evidence/aapt-badging.txt
          grep -F "package: name='com.nexarenew.drstonecommand' versionCode='35' versionName='0.3.1'" evidence/aapt-badging.txt
          grep -F "sdkVersion:'26'" evidence/aapt-badging.txt
          grep -F "targetSdkVersion:'36'" evidence/aapt-badging.txt
          grep -F "application-label:'INTERCEPT'" evidence/aapt-badging.txt
          "$BT/zipalign" -c -v 4 "$APK" | tee evidence/zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee evidence/apksigner.txt
          sha256sum "$APK" | tee evidence/app-debug.apk.sha256
          cp "$APK" evidence/INTERCEPT_V0_3_1_BUILD35_VISUAL_UIUX_UPGRADED_DEBUG.apk

      - name: Re-verify final source after build
        if: always()
        shell: bash
        run: |
          set +e
          failures=0
          while read -r expected path; do
            case "$path" in
              app/src/androidTest/java/com/nexarenew/aiconsole/ui/ChatInteractionInstrumentedTest.kt|app/src/main/java/com/nexarenew/aiconsole/MainActivity.kt|app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt|app/src/main/java/com/nexarenew/aiconsole/ui/screens/DocumentsScreen.kt|app/src/main/java/com/nexarenew/aiconsole/ui/screens/SettingsScreen.kt|app/src/main/java/com/nexarenew/aiconsole/ui/screens/TaskScreen.kt|app/src/main/java/com/nexarenew/aiconsole/ui/screens/WorkspaceScreen.kt|app/src/main/java/com/nexarenew/aiconsole/ui/theme/InterceptTheme.kt) continue ;;
            esac
            [[ -f "src/$path" ]] || { echo "POSTBUILD MISSING $path"; failures=1; continue; }
            actual="$(sha256sum "src/$path" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "POSTBUILD MISMATCH $path"; failures=1; }
          done < payload/CURRENT_BUILD_INPUTS_15092026.sha256
          (cd src && sha256sum -c /tmp/visual-final.sha256) || failures=1
          echo "postbuild_source_failures=$failures" | tee evidence/postbuild-source-verification.txt
          exit "$failures"

      - name: Collect reports
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p evidence/reports
          cp -R src/app/build/reports/tests evidence/reports/unit-tests 2>/dev/null || true
          cp src/app/build/reports/lint-results-debug.html evidence/reports/ 2>/dev/null || true
          cp src/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk evidence/ 2>/dev/null || true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INTERCEPT_BUILD35_VISUAL_UIUX_ACCEPTANCE_EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INTERCEPT_BUILD35_VISUAL_UIUX_VERIFIED_APK
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
