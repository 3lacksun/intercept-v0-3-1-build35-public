name: Build 35 Gradle 8.14.3 IME Composer Acceptance

on:
  push:
    branches:
      - gradle8143-acceptance-15092026

permissions:
  contents: read

env:
  AUTHORITATIVE_SOURCE_SHA256: 4637da3c223a802b80a4d7866d1b822ca4ad769b4e7dfc7dae2daa22c1df1349
  AUTHORITATIVE_SOURCE_URL: https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-c2e4-81fb-9c4f-7d8323f46745/raw?se=2026-09-15T14%3A46%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=a232fbc7-1c23-5272-a8dd-4a77af09db27&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T08%3A28%3A43Z&ske=2026-09-16T08%3A28%3A43Z&sks=b&skv=2026-02-06&sig=Tb22JE6Ypu4VLK658WOjVSbkJ2YMoWd3wuQz1hXiPUM%3D
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=false
    -Dorg.gradle.workers.max=2
    -Dkotlin.compiler.execution.strategy=in-process
    -Dkotlin.incremental=false
    -Dfile.encoding=UTF-8
    -Xmx3g
    -XX:MaxMetaspaceSize=768m
    -XX:+UseSerialGC

jobs:
  ime-composer-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out isolated acceptance branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Reconstruct and verify authoritative Build 35 checkpoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src evidence
          curl --fail --location --retry 3 --retry-delay 2 -o /tmp/authoritative.zip "$AUTHORITATIVE_SOURCE_URL"
          echo "$AUTHORITATIVE_SOURCE_SHA256  /tmp/authoritative.zip" | sha256sum -c -
          sha256sum /tmp/authoritative.zip | tee evidence/authoritative-source.sha256
          unzip -t /tmp/authoritative.zip | tee evidence/authoritative-zip-test.txt
          unzip -q /tmp/authoritative.zip -d src
          cat > src/gradle/wrapper/gradle-wrapper.properties <<'WRAPPER'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionSha256Sum=bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          WRAPPER
          cp payload/CURRENT_BUILD_INPUTS_15092026.sha256 /tmp/base.sha256
          failures=0; count=0
          while read -r expected path; do
            count=$((count+1))
            [[ -f "src/$path" ]] || { echo "MISSING $path"; failures=1; continue; }
            actual="$(sha256sum "src/$path" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "MISMATCH $path expected=$expected actual=$actual"; failures=1; }
          done < /tmp/base.sha256
          [[ "$count" -eq 115 && "$failures" -eq 0 ]]
          echo "115/115 BASE BUILD INPUTS VERIFIED" | tee evidence/base-build-input-verification.txt

      - name: Apply and verify keyboard composer remediation
        shell: bash
        run: |
          set -euo pipefail
          echo '634c099c4f29fad6fe0d67189275fa097a8bd6cc64ef02b80ebb11969427e16b  payload/INTERCEPT_BUILD35_IME_COMPOSER_FIX.patch' | sha256sum -c -
          patch -d src -p1 --fuzz=0 < payload/INTERCEPT_BUILD35_IME_COMPOSER_FIX.patch
          echo 'd28250f58df3afd0b2db8915513916b9e85ad165f02837e4a4fb25f042839af3  src/app/src/main/java/com/nexarenew/aiconsole/MainActivity.kt' | sha256sum -c -
          echo '98b9ff030fc74006dfae64c3328a1726c201ede6206ce95d28409c32d2fa14c7  src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt' | sha256sum -c -
          echo '81846ef1f078ad1a1a06f40d8136259f9a21c269a5fb8d766cefba980f13997b  src/app/src/androidTest/java/com/nexarenew/aiconsole/ui/ChatInteractionInstrumentedTest.kt' | sha256sum -c -
          echo 'cbbd7e6546618ee87255462ccc797fbcf4155b4d3a2088a45e3af6fe1098079e  src/tools/verify-ux-feature-patch.sh' | sha256sum -c -
          (cd src && bash tools/verify-ux-feature-patch.sh) | tee evidence/verify-ux-feature-patch.log
          (cd src && bash tools/verify-build35-uiux-p0.sh) | tee evidence/verify-build35-uiux-p0.log
          (cd src && bash tools/verify-build35-uiux-p1.sh) | tee evidence/verify-build35-uiux-p1.log
          (cd src && bash tools/verify-runtime-remediation-contracts.sh) | tee evidence/verify-runtime-remediation-contracts.log

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > src/local.properties
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" version | tee evidence/aapt2-version.txt

      - name: Verify Gradle 8.14.3 runtime
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --version | tee ../evidence/gradle-version.txt
          grep -F 'Gradle 8.14.3' ../evidence/gradle-version.txt
          java -version 2>&1 | tee ../evidence/java-version.txt

      - name: Unit tests
        working-directory: src
        run: ./gradlew --no-daemon testDebugUnitTest | tee ../evidence/testDebugUnitTest.log

      - name: Compile debug Kotlin
        working-directory: src
        run: ./gradlew --no-daemon :app:compileDebugKotlin | tee ../evidence/compileDebugKotlin.log

      - name: Android lint
        working-directory: src
        run: ./gradlew --no-daemon lintDebug | tee ../evidence/lintDebug.log

      - name: Compile instrumentation APK
        working-directory: src
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest | tee ../evidence/assembleDebugAndroidTest.log

      - name: Clean assemble debug APK
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon clean assembleDebug | tee ../evidence/clean-assembleDebug.log
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK identity alignment signature and digest
        shell: bash
        run: |
          set -euo pipefail
          APK=src/app/build/outputs/apk/debug/app-debug.apk
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/aapt" dump badging "$APK" | tee evidence/aapt-badging.txt
          grep -F "package: name='com.nexarenew.drstonecommand' versionCode='35' versionName='0.3.1'" evidence/aapt-badging.txt
          grep -F "sdkVersion:'26'" evidence/aapt-badging.txt
          grep -F "targetSdkVersion:'36'" evidence/aapt-badging.txt
          grep -F "application-label:'INTERCEPT'" evidence/aapt-badging.txt
          "$BT/zipalign" -c -v 4 "$APK" | tee evidence/zipalign.txt
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee evidence/apksigner.txt
          sha256sum "$APK" | tee evidence/app-debug.apk.sha256
          cp "$APK" evidence/INTERCEPT_V0_3_1_BUILD35_IME_COMPOSER_REMEDIATED_DEBUG.apk

      - name: Re-verify final source after build
        if: always()
        shell: bash
        run: |
          set +e
          failures=0
          while read -r expected path; do
            case "$path" in
              app/src/main/java/com/nexarenew/aiconsole/MainActivity.kt|app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt|app/src/androidTest/java/com/nexarenew/aiconsole/ui/ChatInteractionInstrumentedTest.kt) continue ;;
            esac
            [[ -f "src/$path" ]] || { echo "POSTBUILD MISSING $path"; failures=1; continue; }
            actual="$(sha256sum "src/$path" | awk '{print $1}')"
            [[ "$actual" == "$expected" ]] || { echo "POSTBUILD MISMATCH $path"; failures=1; }
          done < payload/CURRENT_BUILD_INPUTS_15092026.sha256
          [[ "$(sha256sum src/app/src/main/java/com/nexarenew/aiconsole/MainActivity.kt | awk '{print $1}')" == 'd28250f58df3afd0b2db8915513916b9e85ad165f02837e4a4fb25f042839af3' ]] || failures=1
          [[ "$(sha256sum src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt | awk '{print $1}')" == '98b9ff030fc74006dfae64c3328a1726c201ede6206ce95d28409c32d2fa14c7' ]] || failures=1
          [[ "$(sha256sum src/app/src/androidTest/java/com/nexarenew/aiconsole/ui/ChatInteractionInstrumentedTest.kt | awk '{print $1}')" == '81846ef1f078ad1a1a06f40d8136259f9a21c269a5fb8d766cefba980f13997b' ]] || failures=1
          [[ "$(sha256sum src/tools/verify-ux-feature-patch.sh | awk '{print $1}')" == 'cbbd7e6546618ee87255462ccc797fbcf4155b4d3a2088a45e3af6fe1098079e' ]] || failures=1
          echo "postbuild_source_failures=$failures" | tee evidence/postbuild-source-verification.txt
          exit "$failures"

      - name: Collect reports
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p evidence/reports
          cp -R src/app/build/reports/tests evidence/reports/unit-tests 2>/dev/null || true
          cp src/app/build/reports/lint-results-debug.html evidence/reports/ 2>/dev/null || true
          cp src/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk evidence/ 2>/dev/null || true

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INTERCEPT_BUILD35_IME_COMPOSER_ACCEPTANCE_EVIDENCE
          path: evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: INTERCEPT_BUILD35_IME_COMPOSER_VERIFIED_APK
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
