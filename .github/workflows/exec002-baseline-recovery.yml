name: EXEC002 Baseline Recovery

on:
  push:
    branches: [exec002-baseline-recovery-16092026]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover persisted baseline transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          python3 - <<'PY'
          import base64, glob, pathlib
          def recover(pattern, out):
              parts=[]
              for p in sorted(glob.glob(pattern)):
                  s=''.join(pathlib.Path(p).read_text().split())
                  s += '=' * ((4 - len(s) % 4) % 4)
                  parts.append(base64.b64decode(s, validate=False))
              pathlib.Path(out).write_bytes(b''.join(parts))
          recover('payload/exact_build_inputs_*.b64', 'recovery/exact_build_inputs.tar.xz')
          recover('payload/visual_uiux_overlay_*.b64', 'recovery/visual_uiux_overlay.tar.xz')
          PY
          sha256sum recovery/*.tar.xz | tee recovery/SHA256SUMS.txt
          file recovery/*.tar.xz | tee recovery/FILE_TYPES.txt
          xz -t recovery/exact_build_inputs.tar.xz
          xz -t recovery/visual_uiux_overlay.tar.xz
          tar -tJf recovery/exact_build_inputs.tar.xz > recovery/exact_build_inputs.list.txt
          tar -tJf recovery/visual_uiux_overlay.tar.xz > recovery/visual_uiux_overlay.list.txt
      - name: Upload recovered baseline transport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EXEC002_BUILD35_BASELINE_RECOVERY
          path: recovery/
          if-no-files-found: error
          retention-days: 7
