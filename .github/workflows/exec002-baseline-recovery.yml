name: EXEC002 Baseline Recovery

on:
  push:
    branches: [exec002-baseline-recovery-16092026]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Recover persisted baseline transport
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          cat payload/exact_build_inputs_*.b64 | base64 -d > recovery/exact_build_inputs.xz
          cat payload/visual_uiux_overlay_*.b64 | base64 -d > recovery/visual_uiux_overlay.tar.xz
          sha256sum recovery/* | tee recovery/SHA256SUMS.txt
          file recovery/* | tee recovery/FILE_TYPES.txt
          xz -t recovery/exact_build_inputs.xz
          xz -t recovery/visual_uiux_overlay.tar.xz
          (tar -tJf recovery/exact_build_inputs.xz || true) > recovery/exact_build_inputs.list.txt 2>&1
          tar -tJf recovery/visual_uiux_overlay.tar.xz > recovery/visual_uiux_overlay.list.txt
      - name: Upload recovered baseline transport
        uses: actions/upload-artifact@v4
        with:
          name: EXEC002_BUILD35_BASELINE_RECOVERY
          path: recovery/
          if-no-files-found: error
          retention-days: 7
