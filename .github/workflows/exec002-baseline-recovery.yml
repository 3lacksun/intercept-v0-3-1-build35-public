name: EXEC002 Baseline Recovery

on:
  push:
    branches: [exec002-baseline-recovery-16092026]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Export persisted baseline transport fragments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          cp payload/exact_build_inputs_*.b64 recovery/
          cp payload/visual_uiux_overlay_*.b64 recovery/
          cp payload/CURRENT_BUILD_INPUTS_15092026.sha256 recovery/
          sha256sum recovery/* | tee recovery/TRANSPORT_FILES.sha256
      - name: Upload recovered baseline transport
        uses: actions/upload-artifact@v4
        with:
          name: EXEC002_BUILD35_BASELINE_TRANSPORT_RAW
          path: recovery/
          if-no-files-found: error
          retention-days: 7
