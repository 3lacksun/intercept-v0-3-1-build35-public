name: EXEC002 P0 Build Decompile Oracle

on:
  push:
    branches:
      - exec002-known13-recovery-16092026

permissions:
  contents: read

jobs:
  p0-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=false
        -Dorg.gradle.workers.max=2
        -Dkotlin.compiler.execution.strategy=in-process
        -Dkotlin.incremental=false
        -Dfile.encoding=UTF-8
        -Xmx3g
        -XX:MaxMetaspaceSize=768m
        -XX:+UseSerialGC
      P0_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-7ae4-81f4-b9a9-c3297e8550dd/raw?se=2026-09-16T06%3A46%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=357ba362-a9f0-5594-b500-a9adeda81098&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-16T05%3A20%3A07Z&ske=2026-09-17T05%3A20%3A07Z&sks=b&skv=2026-02-06&sig=GIh6UhVTHhOMfiGCI9bmTrHSJtYsxl8m4KWuj1WVnjM%3D"
    steps:
      - name: Download and verify recovered exact P0 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src out
          curl --fail --location --retry 3 --retry-delay 2 "$P0_URL" -o /tmp/p0.zip
          echo '35b7d52e212f5aa27f1e2edb8558b8bdd17b1df2463e9439ae75cfb5812d5643  /tmp/p0.zip' | sha256sum -c -
          unzip -t /tmp/p0.zip > out/p0-zip-test.txt
          unzip -q /tmp/p0.zip -d src
          chmod +x src/gradlew
          sha256sum /tmp/p0.zip > out/p0-source.sha256
          echo 'c13c7a1ffcdc2ee443c4cfc321faeb38a6c9f3e0d6351a1e3828be942541a13d  src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt' | sha256sum -c -

      - name: Apply documented compile-only ChatScreen fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt')
          s=p.read_text()
          old='Modifier.padding(horizontal = 10.dp, bottom = 3.dp)'
          new='Modifier.padding(start = 10.dp, end = 10.dp, bottom = 3.dp)'
          assert s.count(old)==1, s.count(old)
          p.write_text(s.replace(old,new,1))
          PY
          sha256sum src/app/src/main/java/com/nexarenew/aiconsole/ui/screens/ChatScreen.kt | tee out/p0-chat-compilefix.sha256
          printf '%s\n' 'Oracle-only mutation: d313ca3 compile fix; governed P0 ZIP remains untouched.' > out/oracle-mutation.txt

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Ensure Android API 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
          echo "sdk.dir=$ANDROID_HOME" > src/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Assemble pinned P0 debug APK
        working-directory: src
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug | tee ../out/p0-assembleDebug.log
          test -f app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee ../out/p0-apk.sha256

      - name: Install JADX and decompile target classes
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --version | tee out/jadx-version.txt
          mkdir -p /tmp/jadx-p0 out/selected
          /tmp/jadx/bin/jadx --no-res --deobf -j 4 -d /tmp/jadx-p0 src/app/build/outputs/apk/debug/app-debug.apk > out/jadx.log 2>&1 || true
          find /tmp/jadx-p0/sources/com/nexarenew/aiconsole -type f \( -name '*AppViewModel*' -o -name '*ChatScreen*' -o -name '*DocumentsScreen*' -o -name '*SettingsScreen*' -o -name '*WorkspaceScreen*' \) -print | sort > out/selected-files.txt
          test -s out/selected-files.txt
          while IFS= read -r f; do rel=${f#/tmp/jadx-p0/}; mkdir -p "out/selected/$(dirname "$rel")"; cp "$f" "out/selected/$rel"; done < out/selected-files.txt
          find out -type f -printf '%P\t%s bytes\n' | sort > out/inventory.txt

      - name: Upload P0 oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EXEC002_P0_DECOMPILE_ORACLE
          path: out/
          if-no-files-found: error
          retention-days: 30
