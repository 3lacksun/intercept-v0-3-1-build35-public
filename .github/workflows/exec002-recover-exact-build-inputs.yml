name: EXEC002 IME Decompile Oracle

on:
  push:
    branches:
      - exec002-known13-recovery-16092026

permissions:
  contents: read
  actions: read

jobs:
  decompile-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download retained verified IME APK artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apk_artifact out
          gh api /repos/${{ github.repository }}/actions/artifacts/10403490665/zip > /tmp/ime-apk-artifact.zip
          unzip -q /tmp/ime-apk-artifact.zip -d /tmp/apk_artifact
          APK=$(find /tmp/apk_artifact -type f -name '*.apk' | head -1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK" | tee out/apk.sha256
          unzip -t "$APK" > out/apk-zip-test.txt

      - name: Install JADX CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          /tmp/jadx/bin/jadx --version | tee out/jadx-version.txt

      - name: Decompile exact IME APK and isolate target classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jadx-out out/selected
          /tmp/jadx/bin/jadx --no-res --deobf -j 4 -d /tmp/jadx-out "$APK" > out/jadx.log 2>&1 || true
          find /tmp/jadx-out/sources/com/nexarenew/aiconsole -type f \( \
            -name '*AppViewModel*' -o -name '*ChatScreen*' -o -name '*DocumentsScreen*' -o -name '*SettingsScreen*' -o -name '*WorkspaceScreen*' \
          \) -print | sort > out/selected-files.txt
          test -s out/selected-files.txt
          while IFS= read -r f; do
            rel=${f#/tmp/jadx-out/}
            mkdir -p "out/selected/$(dirname "$rel")"
            cp "$f" "out/selected/$rel"
          done < out/selected-files.txt
          grep -RniE 'outbox|retry|relink|attachment|provider|model|memory|document|workspace|dictat|speech|voice|cancel|send|selectedSkill|legacy|pending' out/selected > out/semantic-grep.txt || true
          find out -type f -printf '%P\t%s bytes\n' | sort > out/inventory.txt

      - name: Upload decompilation oracle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EXEC002_IME_DECOMPILE_ORACLE
          path: out/
          if-no-files-found: error
          retention-days: 30
