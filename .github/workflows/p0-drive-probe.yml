name: INTERCEPT P0 Drive Transport Probe

on:
  push:
    branches:
      - intercept-build35-uiux-p0-final-14092026
    paths:
      - '.github/workflows/p0-drive-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact sealed P0 candidate and verify identity
        shell: bash
        run: |
          set -euo pipefail
          URL='https://drive.usercontent.google.com/download?id=1v_tgUDrMiYzMRV5xZY9NuOg-8lunCxHK&export=download&confirm=t'
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 180 \
            -D /tmp/headers.txt "$URL" -o /tmp/candidate.zip
          cat /tmp/headers.txt
          stat -c '%s bytes' /tmp/candidate.zip
          sha256sum /tmp/candidate.zip
          test "$(sha256sum /tmp/candidate.zip | awk '{print $1}')" = '35b7d52e212f5aa27f1e2edb8558b8bdd17b1df2463e9439ae75cfb5812d5643'
          unzip -t /tmp/candidate.zip >/dev/null
          echo 'PASS: exact sealed candidate recovered from Drive.'
