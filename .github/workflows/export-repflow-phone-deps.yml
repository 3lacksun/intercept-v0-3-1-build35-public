name: Export RepFlow Capacitor Phone Dependencies

on:
  push:
    branches: [repflow-watch-toolchain-export-13092026]
    paths:
      - '.github/workflows/export-repflow-phone-deps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-phone-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Resolve exact Capacitor 8.5.0 Android dependency set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phoneprobe/app/src/main/java/net/nexarenew/probe phoneprobe/app/src/main/res/values
          cat > phoneprobe/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name='RepFlowPhoneDependencyProbe'
          include ':app'
          EOF
          cat > phoneprobe/build.gradle <<'EOF'
          buildscript {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.13.0'
                  classpath 'com.google.gms:google-services:4.4.4'
              }
          }
          EOF
          cat > phoneprobe/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > phoneprobe/app/build.gradle <<'EOF'
          apply plugin: 'com.android.application'
          android {
              namespace 'net.nexarenew.probe'
              compileSdk 36
              defaultConfig { applicationId 'net.nexarenew.probe'; minSdk 24; targetSdk 36; versionCode 1; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
          }
          dependencies {
              implementation 'com.google.android.gms:play-services-wearable:20.0.1'
              implementation 'androidx.appcompat:appcompat:1.7.1'
              implementation 'androidx.coordinatorlayout:coordinatorlayout:1.3.0'
              implementation 'androidx.core:core-splashscreen:1.2.0'
              implementation 'androidx.core:core:1.17.0'
              implementation 'androidx.activity:activity:1.11.0'
              implementation 'androidx.fragment:fragment:1.8.9'
              implementation 'androidx.webkit:webkit:1.14.0'
              implementation 'org.apache.cordova:framework:14.0.1'
              testImplementation 'junit:junit:4.13.2'
              testImplementation 'org.json:json:20250517'
              testImplementation 'org.mockito:mockito-core:5.20.0'
              androidTestImplementation 'androidx.test.ext:junit:1.3.0'
              androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
          }
          EOF
          cat > phoneprobe/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"><activity android:name=".ProbeActivity" android:exported="true" /></application></manifest>
          EOF
          cat > phoneprobe/app/src/main/res/values/styles.xml <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>
          EOF
          cat > phoneprobe/app/src/main/java/net/nexarenew/probe/ProbeActivity.java <<'EOF'
          package net.nexarenew.probe;
          public final class ProbeActivity extends android.app.Activity {}
          EOF
          cd phoneprobe
          gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
      - name: Export resolved Gradle modules cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          tar -I 'zstd -10 -T0' -cf export/phone-gradle-modules2.tar.zst -C "$HOME/.gradle/caches" modules-2
          sha256sum export/phone-gradle-modules2.tar.zst > export/SHA256SUMS.txt
          ls -lh export/phone-gradle-modules2.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: repflow-capacitor-phone-gradle-modules2-final
          path: |
            export/phone-gradle-modules2.tar.zst
            export/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
