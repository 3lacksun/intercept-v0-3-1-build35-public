name: Export AndroidX Concurrent Futures 1.2.0

on:
  push:
    branches: [repflow-watch-toolchain-export-13092026]
    paths:
      - '.github/workflows/export-concurrent-futures-120.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Resolve exact AndroidX concurrent-futures 1.2.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe
          cat > probe/settings.gradle <<'EOF'
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name='AndroidXConcurrentFuturesProbe'
          EOF
          cat > probe/build.gradle <<'EOF'
          configurations { target }
          dependencies { target 'androidx.concurrent:concurrent-futures:1.2.0' }
          tasks.register('resolveTarget') {
              doLast { configurations.target.files.each { println it } }
          }
          EOF
          cd probe
          gradle --no-daemon resolveTarget
      - name: Export dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p export
          tar -I 'zstd -10 -T0' -cf export/concurrent-futures-1.2.0-modules2.tar.zst -C "$HOME/.gradle/caches" modules-2
          sha256sum export/*.tar.zst > export/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: androidx-concurrent-futures-1.2.0-modules2
          path: |
            export/concurrent-futures-1.2.0-modules2.tar.zst
            export/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
